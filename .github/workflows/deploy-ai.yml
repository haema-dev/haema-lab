name: "Step 3 [ai]: Deploy FastAPI Model Gateway to GHCR"

on:
  workflow_dispatch:
  push:
    branches: [ master ]
    paths:
      - 'apps/ai/**'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@v4

      # 1. GHCR 로그인 (Python 은 빌드 산출물이 없어 의존성 설치까지 Dockerfile 안에서 한다)
      - name: 🔐 Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 2. Docker 이미지 빌드 및 푸시 (buildx + GitHub Actions 캐시)
      #    캐시가 없으면 러너가 매번 의존성 레이어를 새로 만들고, 내용이 같아도 digest 가 달라져 큰 레이어를 매번 다시 올린다.
      #    gha 캐시로 같은 레이어를 재사용하면 바뀐 소스 레이어만 올라간다. 진행 로그도 레이어별 Waiting 반복 없이 짧다.
      - name: 🧰 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🏷️ Image name
        id: image
        # GHCR 규격: 이미지 이름은 소문자
        run: echo "name=$(echo "ghcr.io/${{ github.repository_owner }}/cloud-ai" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: 🐳 Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./apps/ai
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ steps.image.outputs.name }}:latest
          cache-from: type=gha,scope=ai
          # 캐시 저장은 속도용이다: GitHub 캐시 서버 장애(예: 503 no healthy upstream)로 배포 전체가 실패하지 않게 무시한다.
          cache-to: type=gha,mode=max,scope=ai,ignore-error=true

      # 3. K8s 매니페스트 태그 자동 수정 (GitOps 핵심)
      - name: 📝 Update K8s Manifest
        run: |
          TARGET_FILE="manifests/ai/ai-deployment.yaml"
          sed -i "s|image: ghcr.io/.*|image: ghcr.io/${{ github.repository_owner }}/cloud-ai:${{ github.sha }}|g" $TARGET_FILE
          git add $TARGET_FILE

      # 4. 변경된 태그를 Git에 커밋
      #    apps/ai 와 apps/backend 를 함께 바꾼 머지는 deploy-backend.yml 도 동시에 master 에 push 한다.
      #    그대로 push 하면 늦은 쪽이 non-fast-forward 로 거절되므로 최신 브랜치 위로 rebase 한 뒤 push 한다 (수동 실행 시 실행한 브랜치 기준).
      #    두 워크플로는 서로 다른 파일(manifests/ai, manifests/backend)만 바꿔서 rebase 충돌이 나지 않는다.
      - name: 🚀 Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update ai image tag to ${{ github.sha }}"
          for i in 1 2 3; do
            git pull --rebase --autostash origin "${{ github.ref_name }}" && git push origin "HEAD:${{ github.ref_name }}" && exit 0
            sleep 5
          done
          exit 1
