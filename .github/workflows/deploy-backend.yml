name: "Step 3 [backend]: Deploy Django Backend to GHCR"

on:
  workflow_dispatch:
  push:
    branches: [ master ]
    paths:
      - 'apps/backend/**'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@v4

      # 1. GHCR 로그인 (Python 은 빌드 산출물이 없어 의존성 설치까지 Dockerfile 안에서 한다)
      - name: 🔐 Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 2. Docker 이미지 빌드 및 푸시
      - name: 🐳 Build and Push Docker Image
        run: |
          # 이미지 이름을 소문자로 강제 변환 (GHCR 규격)
          IMAGE_NAME=$(echo "ghcr.io/${{ github.repository_owner }}/cloud-backend" | tr '[:upper:]' '[:lower:]')
          TAG=${{ github.sha }}
          docker build -t $IMAGE_NAME:$TAG -t $IMAGE_NAME:latest ./apps/backend
          docker push $IMAGE_NAME:$TAG
          docker push $IMAGE_NAME:latest

      # 3. K8s 매니페스트 태그 자동 수정 (GitOps 핵심)
      #    API, 워커, 마이그레이션 Job 이 같은 이미지를 쓰므로 manifests/backend 의 image 줄을 모두 바꾼다.
      - name: 📝 Update K8s Manifests
        run: |
          sed -i "s|image: ghcr.io/.*|image: ghcr.io/${{ github.repository_owner }}/cloud-backend:${{ github.sha }}|g" manifests/backend/*.yaml
          git add manifests/backend

      # 4. 변경된 태그를 Git에 커밋
      #    apps/ai 와 apps/backend 를 함께 바꾼 머지는 deploy-ai.yml 도 동시에 master 에 push 한다.
      #    그대로 push 하면 늦은 쪽이 non-fast-forward 로 거절되므로 최신 브랜치 위로 rebase 한 뒤 push 한다 (수동 실행 시 실행한 브랜치 기준).
      #    두 워크플로는 서로 다른 파일(manifests/ai, manifests/backend)만 바꿔서 rebase 충돌이 나지 않는다.
      - name: 🚀 Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update backend image tag to ${{ github.sha }}"
          for i in 1 2 3; do
            git pull --rebase --autostash origin "${{ github.ref_name }}" && git push origin "HEAD:${{ github.ref_name }}" && exit 0
            sleep 5
          done
          exit 1
