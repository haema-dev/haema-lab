name: "Step 3: Deploy Spring Cloud Gateway to GHCR"

on:
  workflow_dispatch:
  push:
    branches: [ master ]
    paths:
      - 'apps/gateway/**'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@v4

      # 1. Java/Kotlin 빌드
      - name: ☕ Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: 🔨 Build with Gradle
        run: |
          chmod +x apps/gateway/gradlew
          ./apps/gateway/gradlew -p apps/gateway clean build -x test

      # 2. GHCR 로그인
      - name: 🔐 Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 3. Docker 이미지 빌드 및 푸시
      - name: 🐳 Build and Push Docker Image
        run: |
          # 이미지 이름을 소문자로 강제 변환 (GHCR 규격)
          IMAGE_NAME=$(echo "ghcr.io/${{ github.repository_owner }}/cloud-gateway" | tr '[:upper:]' '[:lower:]')
          TAG=${{ github.sha }}
          docker build -t $IMAGE_NAME:$TAG -t $IMAGE_NAME:latest ./apps/gateway
          docker push $IMAGE_NAME:$TAG
          docker push $IMAGE_NAME:latest

      # 4. K8s 매니페스트 태그 자동 수정 (GitOps 핵심)
      - name: 📝 Update K8s Manifest
        run: |
          TARGET_FILE="manifests/gateway/gateway-deployment.yaml"
          # 이미지 태그 업데이트
          sed -i "s|image: ghcr.io/.*|image: ghcr.io/${{ github.repository_owner }}/cloud-gateway:${{ github.sha }}|g" $TARGET_FILE
          git add $TARGET_FILE

      # 5. 변경된 태그를 Git에 커밋
      - name: 🚀 Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          # 4번 단계에서 이미 add 했으므로 바로 커밋
          git commit -m "chore: update gateway image tag to ${{ github.sha }}"
          # 여러 앱을 함께 바꾼 머지는 다른 deploy-*.yml 도 동시에 push 한다. 늦은 쪽이 거절되지 않도록
          # 최신 브랜치 위로 rebase 한 뒤 push 한다 (각자 다른 manifests/<앱> 파일만 바꿔서 충돌 없음).
          for i in 1 2 3; do
            git pull --rebase origin "${{ github.ref_name }}" && git push origin "HEAD:${{ github.ref_name }}" && exit 0
            sleep 5
          done
          exit 1