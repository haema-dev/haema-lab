name: "Inject backend-secret"

# 클러스터의 default 네임스페이스에 backend-secret 하나만 만들거나 갱신한다. 다른 리소스는 건드리지 않는다.
# 키 6개: DJANGO_SECRET_KEY, DB_NAME, DB_USER, DB_PASSWORD, DB_HOST, DB_PORT (모두 GitHub Secrets 에서 받는다).
# 순서: 이 워크플로 -> 백엔드 배포. Redis 는 아직 쓰지 않으므로 REDIS_URL 은 넣지 않는다.
on:
  workflow_dispatch:

jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      # 1. 필수 값 확인 + base64 인코딩.
      #    값에 따옴표·$ 같은 문자가 있어도 SSH 로 안전하게 넘기려고 base64 로 보낸다. 값은 로그에 출력하지 않는다.
      - name: 🔎 Validate and encode
        env:
          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
        run: |
          set -eu
          for name in DJANGO_SECRET_KEY DB_NAME DB_USER DB_PASSWORD DB_HOST DB_PORT; do
            if [ -z "${!name}" ]; then
              printf '::error::GitHub Secret %s 이(가) 비어 있습니다.\n' "$name"
              exit 1
            fi
            encoded="$(printf '%s' "${!name}" | base64 -w0)"
            printf '::add-mask::%s\n' "$encoded"
            printf '%s_B64=%s\n' "$name" "$encoded" >> "$GITHUB_ENV"
          done

      - name: 🌎 Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TAILSCALE_OAUTH_CLIENT_SECRET }}
          tags: ${{ secrets.TAILSCALE_AUTH_TAGS }}  # OAuth 클라이언트를 만들 때 고른 태그와 같아야 한다

      - name: 🔑 Apply backend-secret
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.PROXMOX_VM_TAILSCALE_IP }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_USERNAME_PRIVATE_KEY }}
          envs: DJANGO_SECRET_KEY_B64,DB_NAME_B64,DB_USER_B64,DB_PASSWORD_B64,DB_HOST_B64,DB_PORT_B64
          script: |
            set -euo pipefail
            export KUBECONFIG=$HOME/.kube/config
            decode() { printf '%s' "$1" | base64 -d; }

            # 값이 명령행(ps)에 보이지 않도록 임시 env 파일(권한 600)을 거친다. 끝나면 삭제한다.
            umask 077
            envfile="$(mktemp)"
            trap 'rm -f "$envfile"' EXIT
            {
              printf 'DJANGO_SECRET_KEY=%s\n' "$(decode "$DJANGO_SECRET_KEY_B64")"
              printf 'DB_NAME=%s\n' "$(decode "$DB_NAME_B64")"
              printf 'DB_USER=%s\n' "$(decode "$DB_USER_B64")"
              printf 'DB_PASSWORD=%s\n' "$(decode "$DB_PASSWORD_B64")"
              printf 'DB_HOST=%s\n' "$(decode "$DB_HOST_B64")"
              printf 'DB_PORT=%s\n' "$(decode "$DB_PORT_B64")"
            } > "$envfile"

            # create --dry-run | apply: 이미 있으면 갱신, 없으면 생성.
            kubectl create secret generic backend-secret -n default \
              --from-env-file="$envfile" --dry-run=client -o yaml | kubectl apply -f -

            # 키 이름과 크기만 출력한다(값은 출력되지 않는다). 6개가 보이면 정상.
            kubectl describe secret backend-secret -n default | sed -n '/^Data/,$p'

            # 떠 있는 파드는 환경변수를 다시 읽지 않으므로 Deployment 가 있으면 재시작한다. 없으면(첫 배포 전) 건너뛴다.
            # if kubectl get deploy cloud-backend -n default >/dev/null 2>&1; then
            #   kubectl rollout restart deploy/cloud-backend -n default
            # else
            #   printf 'cloud-backend Deployment 가 아직 없어 재시작을 건너뜁니다.\n'
            # fi
