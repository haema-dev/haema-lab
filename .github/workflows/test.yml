name: "Test"

# 머지 전 테스트. 배포(deploy-*.yml)는 하지 않고, 레포에 커밋도 하지 않는다.
# 외부 의존(Ollama, Gemini, Redis, 실제 모델)은 모두 mock 이다.
# backend 의 DB 테스트만 실제 PostgreSQL + pgvector 컨테이너를 쓴다 (chat_* 테이블이 pgvector 타입이라 mock 불가).
#
# 구조: changes 가 PR 에서 바뀐 앱을 찾고, 바뀐 앱의 테스트 job 만 돈다. 나머지는 skipped.
#   - 워크플로 자체는 모든 PR 에서 돈다(paths 필터를 워크플로에 걸면 안 뜬 체크가 필수 체크를 영원히 막는다).
#   - 브랜치 보호의 필수 체크는 마지막 "test-result" 하나만 걸면 된다. 앱이 늘어도 필수 체크를 고칠 필요가 없다.
#   - 이 파일이 바뀌면 세 앱 모두 돈다. workflow_dispatch(수동 실행)도 모두 돈다.
on:
  workflow_dispatch:
  pull_request:
    branches: [ master ]

permissions:
  contents: read
  pull-requests: read  # paths-filter 가 PR 의 변경 파일 목록을 API 로 읽는다

# 같은 PR 에 새 커밋이 오면 이전 실행은 취소한다.
concurrency:
  group: test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      ai: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.ai == 'true' }}
      backend: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.backend == 'true' }}
      gateway: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.gateway == 'true' }}
    steps:
      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            workflow: &workflow
              - '.github/workflows/test.yml'
            ai:
              - 'apps/ai/**'
              - *workflow
            backend:
              - 'apps/backend/**'
              - *workflow
            gateway:
              - 'apps/gateway/**'
              - *workflow

  ai:
    needs: changes
    if: needs.changes.outputs.ai == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/ai
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      # Dockerfile 과 같은 이유로 --no-install-project (src/ 가 패키지 구조가 아님). dev 그룹(pytest, respx)은 포함.
      - name: Install
        run: uv sync --frozen --no-install-project
      - name: Pytest (Ollama 는 respx mock)
        run: uv run --no-sync pytest -q

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # 테스트 전용 값. Django 가 test_postgres DB 를 만들고 끝나면 지운다.
      DJANGO_SECRET_KEY: test-only
      DB_NAME: postgres
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: localhost
      DB_PORT: "5432"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"  # Dockerfile 과 같은 버전
          cache: pip
          cache-dependency-path: apps/backend/requirements.txt
      - name: Install
        run: pip install -r requirements.txt
      # core(검증), chat(파이프라인·워커·클라이언트). FastAPI·Redis 는 patch/MockTransport.
      - name: Django tests
        run: python manage.py test -v 2

  gateway:
    needs: changes
    if: needs.changes.outputs.gateway == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'
      # 라우팅 테스트는 mock 요청만 쓴다 (프론트·백엔드로 실제 요청을 보내지 않음).
      - name: Gradle test
        run: |
          chmod +x apps/gateway/gradlew
          ./apps/gateway/gradlew -p apps/gateway test

  # 필수 체크로 거는 job. 하나라도 failure/cancelled 면 실패, 바뀌지 않아 skipped 인 것은 통과로 본다.
  test-result:
    if: always()
    needs: [changes, ai, backend, gateway]
    runs-on: ubuntu-latest
    steps:
      - name: Summarize
        run: |
          echo "changes=${{ needs.changes.result }} ai=${{ needs.ai.result }} backend=${{ needs.backend.result }} gateway=${{ needs.gateway.result }}"
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "::error::실패하거나 취소된 테스트가 있습니다."
            exit 1
          fi
