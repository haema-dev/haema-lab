[project]
name = "ai"
version = "0.1.0"
description = "Stateless model gateway: Ollama (embed, generate)"
authors = [
    { name = "SUA", email = "haemahmtea@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.142.1",
    "httpx>=0.28.1",
    "pydantic-settings>=2.15.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
ai = "ai:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "respx>=0.23.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
