# SPA: /query 같은 경로로 새로고침해도 index.html 을 준다(React Router 가 처리).
# /api/** 는 Gateway 가 Django 로 보내므로 여기까지 오지 않는다.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 해시가 붙은 빌드 산출물은 오래 캐시, index.html 은 캐시하지 않는다(새 배포가 바로 보이도록).
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
