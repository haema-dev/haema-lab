# SPA: /query 같은 경로로 새로고침해도 index.html 을 준다(React Router 가 처리).
# /api/** 는 Gateway 가 Django 로 보내므로 정상이라면 여기까지 오지 않는다.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # Gateway 의 /api 라우트가 꺼져 있으면 /api 요청이 여기로 온다. index.html(200)을 주면
    # 클라이언트가 성공으로 착각하므로 JSON 404 로 돌려준다(2026-11-25: 꺼진 상태에서 200 text/html 확인).
    location /api/ {
        default_type application/json;
        return 404 '{"error": "API 라우트가 꺼져 있습니다. Gateway 의 /api 설정을 확인해 주세요."}';
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 해시가 붙은 빌드 산출물은 오래 캐시, index.html 은 캐시하지 않는다(새 배포가 바로 보이도록).
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
