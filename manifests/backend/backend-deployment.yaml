apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloud-backend
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cloud-backend
  template:
    metadata:
      labels:
        app: cloud-backend
    spec:
      containers:
      - name: backend
        # 이 줄은 deploy-backend.yml 이 sed 로 자동 갱신한다. 최초 값은 첫 빌드 전 자리표시자.
        image: ghcr.io/haema-dev/cloud-backend:latest
        ports:
        - containerPort: 8000
        env:
        # 비밀값은 레포에 없다. backend-secret 은 클러스터에만 만든다 (apps/backend/DEPLOY.md 참고).
        - name: DJANGO_SECRET_KEY
          valueFrom:
            secretKeyRef: { name: backend-secret, key: DJANGO_SECRET_KEY }
        - name: DB_NAME
          valueFrom:
            secretKeyRef: { name: backend-secret, key: DB_NAME }
        - name: DB_USER
          valueFrom:
            secretKeyRef: { name: backend-secret, key: DB_USER }
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef: { name: backend-secret, key: DB_PASSWORD }
        - name: DB_HOST
          valueFrom:
            secretKeyRef: { name: backend-secret, key: DB_HOST }
        - name: DB_PORT
          valueFrom:
            secretKeyRef: { name: backend-secret, key: DB_PORT }
        # - name: REDIS_URL           # 비밀번호가 들어 있어 통째로 Secret
        #   valueFrom:
        #     secretKeyRef: { name: backend-secret, key: REDIS_URL }
        - name: DJANGO_DEBUG
          value: "0"
        # Gateway 는 대상 서비스 DNS 를 Host 로 넘긴다. localhost 는 아래 프로브용.
        - name: DJANGO_ALLOWED_HOSTS
          value: "cloud-backend-svc,cloud-backend-svc.default.svc.cluster.local,localhost"
        # 모델 게이트웨이(apps/ai). 클러스터 안 주소만 쓴다.
        # - name: FASTAPI_BASE_URL
        #   value: "http://cloud-ai-svc.default.svc.cluster.local"
        resources:
          # 값은 추정이며 측정 전이다 (gunicorn 워커 2개 기준).
          limits:
            cpu: "500m"
            memory: "512Mi"
          requests:
            cpu: "100m"
            memory: "192Mi"
        # readinessProbe:
        #   httpGet:
        #     path: /health
        #     port: 8000
        #     httpHeaders:
        #     - name: Host
        #       value: localhost   # 프로브는 파드 IP 를 Host 로 보내 ALLOWED_HOSTS 에 막힌다
        #   initialDelaySeconds: 10
        #   periodSeconds: 10
