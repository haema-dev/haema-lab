# 워커: API 와 같은 이미지. Redis 큐에서 job 하나씩 꺼내 끝까지 처리한다.
# `manage.py run_worker` 는 SIGTERM 을 받으면 진행 중인 job 을 끝내고 멈춘다.
# deploy-backend.yml 이 manifests/backend/*.yaml 의 image 줄을 API 와 같은 태그로 갱신한다.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloud-backend-worker
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cloud-backend-worker
  template:
    metadata:
      labels:
        app: cloud-backend-worker
    spec:
      # 생성 한 건이 길면 약 2분(README: 긴 RAG 프롬프트 total 111s)이라 종료 시 여유를 준다.
      terminationGracePeriodSeconds: 120
      containers:
      - name: worker
        image: ghcr.io/haema-dev/cloud-backend:294495f77ee6b42f25854940b2028e09d6555806
        command: ["python", "manage.py", "run_worker"]
        env:
        - name: DJANGO_SECRET_KEY
          valueFrom:
            secretKeyRef: { name: backend-secret, key: DJANGO_SECRET_KEY }
        - name: DB_NAME
          valueFrom:
            secretKeyRef: { name: backend-secret, key: DB_NAME }
        - name: DB_USER
          valueFrom:
            secretKeyRef: { name: backend-secret, key: DB_USER }
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef: { name: backend-secret, key: DB_PASSWORD }
        - name: DB_HOST
          valueFrom:
            secretKeyRef: { name: backend-secret, key: DB_HOST }
        - name: DB_PORT
          valueFrom:
            secretKeyRef: { name: backend-secret, key: DB_PORT }
        - name: REDIS_URL
          valueFrom:
            secretKeyRef: { name: backend-secret, key: REDIS_URL }
        # 선택: Discord 웹훅 (chat/notify.py). Secret 에 키가 없으면 비어 있고 알림만 꺼진다.
        - name: DISCORD_WEBHOOK_URL
          valueFrom:
            secretKeyRef: { name: backend-secret, key: DISCORD_WEBHOOK_URL, optional: true }
        - name: DJANGO_DEBUG
          value: "0"
        - name: FASTAPI_BASE_URL
          value: "http://cloud-ai-svc.default.svc.cluster.local"
        resources:
          # 추정, 미측정
          limits:
            cpu: "500m"
            memory: "512Mi"
          requests:
            cpu: "100m"
            memory: "192Mi"
