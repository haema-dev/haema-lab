# Redis: Django API/워커 전용 job 큐(chat:jobs)와 GPU 세마포어(chat:gpu-slot:N).
# 영속성은 RDB 스냅샷만 쓴다 (AOF 끔). 마지막 스냅샷 이후 쓰기는 재시작 시 잃을 수 있다.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: cloud-redis
  namespace: default
spec:
  serviceName: cloud-redis-svc
  replicas: 1
  selector:
    matchLabels:
      app: cloud-redis
  template:
    metadata:
      labels:
        app: cloud-redis
    spec:
      containers:
      - name: redis
        image: redis:7.4-alpine
        args:
        - "--requirepass"
        - "$(REDIS_PASSWORD)"
        # 60초 안에 쓰기가 1번이라도 있으면 스냅샷 (추정값, 미측정)
        - "--save"
        - "60 1"
        - "--appendonly"
        - "no"
        # 큐에는 message_id 만 들어가므로 작게 잡는다 (추정값, 미측정)
        - "--maxmemory"
        - "128mb"
        # 메모리가 차도 큐 항목을 지우지 않는다. 지우면 처리 안 된 요청이 조용히 사라진다.
        - "--maxmemory-policy"
        - "noeviction"
        ports:
        - containerPort: 6379
        env:
        # 비밀값은 레포에 없다. redis-secret 은 secret.yaml 워크플로가 클러스터에만 만든다.
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef: { name: redis-secret, key: REDIS_PASSWORD }
        # redis-cli 가 이 변수로 인증한다 (프로브용)
        - name: REDISCLI_AUTH
          valueFrom:
            secretKeyRef: { name: redis-secret, key: REDIS_PASSWORD }
        readinessProbe:
          exec:
            command: ["redis-cli", "ping"]
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          exec:
            command: ["redis-cli", "ping"]
          initialDelaySeconds: 15
          periodSeconds: 30
          timeoutSeconds: 5
        resources:
          # 값은 추정이며 측정 전이다.
          limits:
            cpu: "200m"
            memory: "256Mi"
          requests:
            cpu: "50m"
            memory: "64Mi"
        volumeMounts:
        - name: data
          mountPath: /data
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: ["ReadWriteOnce"]
      # storageClassName 을 비우면 클러스터 기본 StorageClass 를 쓴다. 기본값이 없으면 PVC 가 Pending 으로 남는다.
      resources:
        requests:
          storage: 1Gi
